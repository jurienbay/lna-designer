name: Code Quality Linting Suite

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  ruff-lint:
    name: Execute Ruff Code Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code Repo
        uses: actions/checkout@v4

      - name: Initialize Isolated Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Fetch and Bind Ruff Ecosystem Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Audit Structural Formatting (Ruff Check)
        run: ruff check .

      - name: Audit Syntax & Style Layouts (Ruff Format)
        run: ruff format --check .
